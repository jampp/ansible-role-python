---

- name: Install packages (RedHat)
  yum:
    state: present
    name: "{{python_default_packages}}"
  when: not (ansible_distribution == 'Amazon' and ansible_distribution_major_version == '2023')

- name: Install packages (RedHat, AL2023)
  dnf:
    state: present
    name: "{{python_default_packages}}"
    allowerasing: true
  when: ansible_distribution == 'Amazon' and ansible_distribution_major_version == '2023'

- name: Install packages (CentOS)
  yum:
    state: present
    name: "{{python_default_packages_centos|default([])}}"
  when: ansible_distribution == "CentOS"

- name: Install packages (Amazon Linux)
  action:
    module: "{{ 'dnf' if ansible_distribution == 'Amazon' and ansible_distribution_major_version == '2023' else 'yum' }}"
    state: present
    name: "{{python_default_packages_amzn|default([])}}"
  when: ansible_distribution == "Amazon"

- name: Install additional dev packages
  action:
    module: "{{ 'dnf' if ansible_distribution == 'Amazon' and ansible_distribution_major_version == '2023' else 'yum' }}"
    state: present
    name: "{{python_dev_packages}}"

